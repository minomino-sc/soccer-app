<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="神戸三宮FC U13"
  >

  <title>⚽ 神戸三宮FC U13｜兵庫県ルーキーリーグ</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(0, 170, 90, 0.24),
          transparent 42%
        ),
        linear-gradient(
          160deg,
          #020a06 0%,
          #061a10 48%,
          #020805 100%
        );

      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;

      padding:
        22px 12px 40px;
    }

    /* =========================================
       HEADER
    ========================================= */

    .header {
      text-align: center;

      padding:
        18px 10px 24px;

      border-bottom:
        1px solid
        rgba(80, 220, 130, 0.20);
    }

    .title {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 7px;

      color: #67e69a;

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 2px;
    }

    /* =========================================
       SECTION
    ========================================= */

    .section {
      margin-top: 22px;
    }

    .section-title {
      display: flex;
      align-items: center;

      gap: 8px;

      margin-bottom: 10px;

      font-size: 17px;
      font-weight: 900;
    }

    .section-title span {
      color: #67e69a;
    }

    /* =========================================
       STATUS
    ========================================= */

    .status-card {
      padding: 18px;

      border:
        1px solid
        rgba(80, 220, 130, 0.25);

      border-radius: 17px;

      background:
        linear-gradient(
          145deg,
          rgba(12, 67, 40, 0.96),
          rgba(4, 25, 15, 0.98)
        );

      box-shadow:
        0 8px 24px
        rgba(0, 0, 0, 0.22);
    }

    .rank {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .rank-number {
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
    }

    .rank-label {
      color: #8fb5a0;
      font-size: 12px;
    }

    .team-name {
      margin-top: 8px;

      font-size: 21px;
      font-weight: 900;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);

      gap: 8px;

      margin-top: 15px;
    }

    .stat {
      padding: 10px 5px;

      text-align: center;

      border-radius: 11px;

      background:
        rgba(255, 255, 255, 0.05);
    }

    .stat-value {
      font-size: 20px;
      font-weight: 900;
    }

    .stat-label {
      margin-top: 3px;

      color: #8fb5a0;

      font-size: 9px;
    }

    /* =========================================
       TABLE
    ========================================= */

    .table-wrap {
      overflow-x: auto;

      border-radius: 14px;

      border:
        1px solid
        rgba(80, 220, 130, 0.18);
    }

    table {
      width: 100%;
      min-width: 590px;

      border-collapse: collapse;

      background:
        rgba(4, 20, 12, 0.96);

      font-size: 11px;
    }

    th {
      padding: 10px 6px;

      color: #9fc2ae;

      background:
        rgba(40, 130, 75, 0.20);

      font-weight: 800;

      white-space: nowrap;
    }

    td {
      padding: 10px 6px;

      border-top:
        1px solid
        rgba(255, 255, 255, 0.06);

      text-align: center;

      white-space: nowrap;
    }

    td.team {
      text-align: left;

      font-weight: 800;
    }

    tr.highlight {
      background:
        rgba(46, 220, 120, 0.15);
    }

    tr.highlight td {
      color: #ffffff;
      font-weight: 900;
    }

    .rank-cell {
      width: 40px;

      font-weight: 900;
    }

    /* =========================================
       MATCH
    ========================================= */

    .match-list {
      display: grid;

      gap: 10px;
    }

    .match-card {
      padding: 14px 15px;

      border:
        1px solid
        rgba(80, 220, 130, 0.18);

      border-radius: 15px;

      background:
        linear-gradient(
          145deg,
          rgba(9, 50, 31, 0.96),
          rgba(4, 23, 14, 0.98)
        );
    }

    .match-date {
      color: #8fb5a0;

      font-size: 10px;
    }

    .match-body {
      display: grid;

      grid-template-columns:
        1fr auto 1fr;

      align-items: center;

      gap: 8px;

      margin-top: 8px;
    }

    .match-team {
      font-size: 13px;
      font-weight: 800;
    }

    .match-team.home {
      text-align: right;
    }

    .score {
      min-width: 65px;

      text-align: center;

      font-size: 21px;
      font-weight: 900;
    }

    .result {
      margin-top: 8px;

      text-align: center;

      font-size: 11px;
      font-weight: 900;
    }

    .win {
      color: #55e889;
    }

    .draw {
      color: #ffd65a;
    }

    .loss {
      color: #ff7d7d;
    }

    /* =========================================
       NOTICE
    ========================================= */

    .notice {
      margin-top: 20px;

      padding: 12px 14px;

      border-radius: 12px;

      background:
        rgba(255, 255, 255, 0.04);

      color:
        rgba(255, 255, 255, 0.52);

      font-size: 9px;

      line-height: 1.7;
    }

    /* =========================================
       BACK BUTTON
    ========================================= */

    .back-button {
      display: block;

      margin-top: 25px;

      padding: 14px;

      border:
        1px solid
        rgba(80, 220, 130, 0.22);

      border-radius: 14px;

      color: #ffffff;

      background:
        rgba(255, 255, 255, 0.04);

      text-align: center;

      text-decoration: none;

      font-size: 13px;
      font-weight: 800;
    }

    /* =========================================
       FOOTER
    ========================================= */

    footer {
      margin-top: 25px;

      text-align: center;

      color:
        rgba(255, 255, 255, 0.25);

      font-size: 8px;

      letter-spacing: 1px;
    }

  </style>

</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="title">
      ⚽ 神戸三宮FC
    </div>

    <div class="subtitle">
      U13｜兵庫県ルーキーリーグ
    </div>

  </header>


  <!-- CURRENT POSITION -->

  <section class="section">

    <div class="section-title">
      🏆 <span>現在の順位</span>
    </div>

    <div
      id="statusCard"
      class="status-card"
    >
      読み込み中…
    </div>

  </section>


  <!-- STANDINGS -->

  <section class="section">

    <div class="section-title">
      📊 <span>順位表</span>
    </div>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>順位</th>
            <th>チーム</th>
            <th>試合</th>
            <th>勝</th>
            <th>分</th>
            <th>敗</th>
            <th>得点</th>
            <th>失点</th>
            <th>得失</th>
            <th>勝点</th>
          </tr>

        </thead>

        <tbody id="standingsBody">

        </tbody>

      </table>

    </div>

  </section>


  <!-- MATCH RESULTS -->

  <section class="section">

    <div class="section-title">
      ⚽ <span>神戸三宮FC 試合結果</span>
    </div>

    <div
      id="matchList"
      class="match-list"
    >
      読み込み中…
    </div>

  </section>


  <!-- NOTICE -->

  <div class="notice">

    ※ 本ページの情報は、兵庫少年サッカー応援団等に掲載されている
    リーグ戦績情報を参考にしています。<br>

    ※ 外部掲載情報の更新状況により、最新結果の反映に時間差が生じる場合があります。<br>

    ※ 正式な結果については、兵庫県サッカー協会・各チーム等の公式発表をご確認ください。

    <div id="updatedAt"></div>

  </div>


  <!-- BACK -->

  <a
    class="back-button"
    href="../"
  >
    ← メインメニューへ戻る
  </a>


  <footer>
    KOBE SANNOMIYA FC
  </footer>

</div>


<script>

  const TEAM_NAME = "神戸三宮FC";

  async function loadData() {

    try {

      const response =
        await fetch(
          "./data.json?ts=" +
          Date.now()
        );

      if (!response.ok) {
        throw new Error(
          "data.jsonを取得できませんでした"
        );
      }

      const data =
        await response.json();

      renderStatus(data);

      renderStandings(data);

      renderMatches(data);

      renderUpdatedAt(data);

    } catch (error) {

      console.error(error);

      document.getElementById(
        "statusCard"
      ).innerHTML =
        "データを読み込めませんでした。";

      document.getElementById(
        "matchList"
      ).innerHTML =
        "データを読み込めませんでした。";

    }

  }


  function renderStatus(data) {

    const team =
      data.standings.find(
        item =>
          item.team === TEAM_NAME
      );

    if (!team) {
      return;
    }

    document.getElementById(
      "statusCard"
    ).innerHTML = `

      <div class="rank">

        <div class="rank-number">
          ${team.rank}
        </div>

        <div class="rank-label">
          位
        </div>

      </div>

      <div class="team-name">
        ${team.team}
      </div>

      <div class="stats">

        <div class="stat">

          <div class="stat-value">
            ${team.played}
          </div>

          <div class="stat-label">
            試合
          </div>

        </div>

        <div class="stat">

          <div class="stat-value">
            ${team.points}
          </div>

          <div class="stat-label">
            勝点
          </div>

        </div>

        <div class="stat">

          <div class="stat-value">
            ${team.goalDiff > 0
              ? "+" + team.goalDiff
              : team.goalDiff}
          </div>

          <div class="stat-label">
            得失点差
          </div>

        </div>

      </div>

    `;

  }


  function renderStandings(data) {

    const body =
      document.getElementById(
        "standingsBody"
      );

    body.innerHTML = "";

    data.standings.forEach(
      team => {

        const row =
          document.createElement(
            "tr"
          );

        if (
          team.team === TEAM_NAME
        ) {

          row.className =
            "highlight";

        }

        row.innerHTML = `

          <td class="rank-cell">
            ${team.rank}
          </td>

          <td class="team">
            ${team.team}
          </td>

          <td>
            ${team.played}
          </td>

          <td>
            ${team.wins}
          </td>

          <td>
            ${team.draws}
          </td>

          <td>
            ${team.losses}
          </td>

          <td>
            ${team.goalsFor}
          </td>

          <td>
            ${team.goalsAgainst}
          </td>

          <td>
            ${team.goalDiff > 0
              ? "+" + team.goalDiff
              : team.goalDiff}
          </td>

          <td>
            ${team.points}
          </td>

        `;

        body.appendChild(row);

      }
    );

  }


  function renderMatches(data) {

    const list =
      document.getElementById(
        "matchList"
      );

    list.innerHTML = "";

    if (
      !data.matches ||
      !data.matches.length
    ) {

      list.innerHTML =
        "試合結果はまだありません。";

      return;

    }

    data.matches.forEach(
      match => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "match-card";

        let resultClass =
          "draw";

        let resultText =
          "△ DRAW";

        if (
          match.home === TEAM_NAME
        ) {

          if (
            match.homeScore >
            match.awayScore
          ) {

            resultClass =
              "win";

            resultText =
              "○ WIN";

          } else if (
            match.homeScore <
            match.awayScore
          ) {

            resultClass =
              "loss";

            resultText =
              "● LOSS";

          }

        } else {

          if (
            match.awayScore >
            match.homeScore
          ) {

            resultClass =
              "win";

            resultText =
              "○ WIN";

          } else if (
            match.awayScore <
            match.homeScore
          ) {

            resultClass =
              "loss";

            resultText =
              "● LOSS";

          }

        }

        card.innerHTML = `

          <div class="match-date">
            ${match.date || ""}
          </div>

          <div class="match-body">

            <div class="match-team home">
              ${match.home}
            </div>

            <div class="score">
              ${match.homeScore}
              -
              ${match.awayScore}
            </div>

            <div class="match-team">
              ${match.away}
            </div>

          </div>

          <div class="result ${resultClass}">
            ${resultText}
          </div>

        `;

        list.appendChild(card);

      }
    );

  }


  function renderUpdatedAt(data) {

    if (!data.updatedAt) {
      return;
    }

    document.getElementById(
      "updatedAt"
    ).textContent =
      "データ更新：" +
      data.updatedAt;

  }


  loadData();

</script>

</body>
</html>
