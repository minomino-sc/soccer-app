<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚽ KOBE SANNOMIYA FC｜JUNIOR YOUTH TRANSPORT</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- =========================================
       HEADER
  ========================================== -->
  <header class="header">

    <div class="club-mark">
      <img
        src="IMG_6321.jpeg"
        alt="KOBE SANNOMIYA FC"
      >
    </div>

    <div>
      <div class="club-name">
        KOBE SANNOMIYA FC
      </div>

      <div class="sub-title">
        JUNIOR YOUTH TRANSPORT
      </div>
    </div>

  </header>


  <!-- =========================================
       CLOCK
  ========================================== -->
  <section class="clock-panel">

    <div id="currentDate">
      ----
    </div>

    <div id="currentTime">
      --:--:--
    </div>

    <div id="dayType">
      ----
    </div>

  </section>


  <!-- =========================================
       VENUE
  ========================================== -->
  <section class="section">

    <h2>
      TRAINING VENUE
    </h2>

    <div class="venue-grid">

      <button
        type="button"
        class="venue-button"
        data-venue="onohama"
      >
        <span class="venue-icon">🏟️</span>
        <span>小野浜公園球技場</span>
      </button>


      <button
        type="button"
        class="venue-button"
        data-venue="koreanch"
      >
        <span class="venue-icon">🏫</span>
        <span>神戸朝鮮初中級学校</span>
      </button>


      <button
        type="button"
        class="venue-button"
        data-venue="comista"
      >
        <span class="venue-icon">🏢</span>
        <span>コミスタこうべ</span>
      </button>

    </div>

  </section>


  <!-- =========================================
       DIRECTION
  ========================================== -->
  <section
    id="directionSection"
    class="section hidden"
  >

    <h2>
      ROUTE
    </h2>

    <div class="direction-grid">

      <button
        type="button"
        class="direction-button"
        data-direction="go"
      >
        <strong>行き</strong>
        <small>TO TRAINING</small>
      </button>


      <button
        type="button"
        class="direction-button"
        data-direction="return"
      >
        <strong>帰り</strong>
        <small>FROM TRAINING</small>
      </button>

    </div>

  </section>


  <!-- =========================================
       SEARCH
  ========================================== -->
  <section
    id="searchSection"
    class="section hidden"
  >

    <h2>
      DEPARTURE TIME
    </h2>


    <div class="search-panel">

      <!-- 乗車予定日 -->
      <div class="search-label">
        乗車予定日
      </div>

      <div class="date-search-row">

        <input
          id="searchDate"
          type="date"
          aria-label="乗車予定日"
        >

      </div>


      <!-- 乗車予定時刻 -->
      <div class="search-label time-label">
        乗車予定時刻
      </div>


      <div class="time-search-row">

        <input
          id="searchTime"
          type="time"
          value="12:00"
          aria-label="乗車予定時刻"
        >


        <button
          type="button"
          id="nowButton"
          class="now-button"
        >
          現在時刻
        </button>


        <button
          type="button"
          id="searchButton"
          class="search-button"
        >
          検索
        </button>

      </div>


      <div class="search-help">
        入力した日付・時刻以降に出発できる乗り継ぎルートを検索します。
      </div>

    </div>

  </section>


  <!-- =========================================
       RESULT
  ========================================== -->
  <section
    id="resultSection"
    class="section hidden"
  >

    <div class="result-header">

      <div>

        <div
          id="selectedVenue"
          class="selected-venue"
        ></div>

        <div
          id="selectedDirection"
          class="selected-direction"
        ></div>

      </div>


      <button
        type="button"
        id="backButton"
        class="back-button"
      >
        変更
      </button>

    </div>


    <div
      id="searchSummary"
      class="search-summary"
    ></div>


    <!-- 横スクロールする候補 -->
    <div
      id="routeScroller"
      class="route-scroller"
    >

      <div
        id="routeCards"
        class="route-cards"
      ></div>

    </div>


    <div class="scroll-hint">
      ← 左右にスワイプして次の候補 →
    </div>

  </section>


<!-- =========================================
     TIMETABLE CHECK
========================================== -->
<section
  id="timetableCheckSection"
  class="section timetable-check-section"
>

  <div class="timetable-check-title-row">

    <h2>
      TIMETABLE STATUS
    </h2>

<a
  class="timetable-check-run-button"
  href="https://github.com/minomino/soccer-app/actions/workflows/timetable-check.yml"
  target="_blank"
  rel="noopener"
>
  🔄 今すぐチェック
</a>    

  </div>


  <!-- チェック結果の開閉 -->
  <button
    type="button"
    id="timetableCheckToggle"
    class="timetable-check-toggle"
    aria-expanded="false"
  >
    <span id="timetableCheckToggleIcon">
      ▶
    </span>

    <span>
      チェック結果を表示
    </span>
  </button>


  <div
    id="timetableCheckPanel"
    class="timetable-check-panel hidden"
  >

    <div class="timetable-check-loading">
      時刻表チェック状況を確認中…
    </div>

  </div>

</section>
  

  <!-- =========================================
       FOOTER
  ========================================== -->
  <footer>

    <div>
      KOBE SANNOMIYA FC
    </div>

    <div class="footer-small">
      JUNIOR YOUTH TRANSPORT SYSTEM
    </div>

  </footer>

</div>


<script src="timetable.js"></script>
<script src="main.js"></script>

</body>
</html>
