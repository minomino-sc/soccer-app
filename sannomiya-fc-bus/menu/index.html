    /* =========================================
       MATCH RESULTS
    ========================================= */

      display: none;

      margin-top: -4px;

      padding:

    }


    .results-menu.open {
      display: grid;

      gap: 10px;
    }


    /* =========================================
       AGE BUTTON
    ========================================= */

    .age-button {
      width: 100%;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

      padding:
        14px 16px;

      border:
        1px solid
        rgba(80, 220, 130, 0.18);

      border-radius: 13px;

      background:
        rgba(5, 30, 18, 0.92);

      color: #ffffff;

      font-size: 15px;

      font-weight: 900;

      text-align: left;

      cursor: pointer;

      -webkit-tap-highlight-color:
        rgba(50, 220, 120, 0.18);
    }


    .age-button:active {
      transform:
        scale(0.99);
    }


    .age-arrow {
      color: #63df96;

      font-size: 18px;

      transition:

    }


    .age-button.active .age-arrow {

    }


    /* =========================================

    /* =========================================

  <script>

    /* =========================================
       試合結果メニュー開閉
    ========================================= */

    function toggleResults() {

      const menu =
        document.getElementById(
          "resultsMenu"
        );

      const arrow =
        document.getElementById(
          "resultsArrow"
        );

      menu.classList.toggle(
        "open"
      );

      if (
        menu.classList.contains(
          "open"
        )
      ) {

        arrow.style.transform =
          "rotate(90deg)";

      } else {

        arrow.style.transform =
          "rotate(0deg)";

      }

    }


    /* =========================================
       年代別大会開閉
    ========================================= */

    function toggleAge(
      id
    ) {

      const list =
        document.getElementById(
          id
        );

      const button =
        list.previousElementSibling;

      const isOpen =
        list.classList.contains(
          "open"
        );


      /*
       * 同じ年代を閉じる
       */

      list.classList.toggle(
        "open"
      );

      button.classList.toggle(
        "active"
      );


      /*
       * 他の年代は閉じる
       */

      document
        .querySelectorAll(
          ".tournament-list"
        )
        .forEach(
          other => {

            if (
              other !== list
            ) {

              other.classList.remove(
                "open"
              );

              if (
                other.previousElementSibling
              ) {

                other
                  .previousElementSibling
                  .classList
                  .remove(
                    "active"
                  );

              }

            }

          }
        );

    }

  </script>
