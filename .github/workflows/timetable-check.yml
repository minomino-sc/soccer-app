name: Timetable Check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-timetable:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install cheerio
          sudo apt-get update
          sudo apt-get install -y poppler-utils imagemagick tesseract-ocr tesseract-ocr-jpn


      - name: Diagnose Port Liner certificate
        run: |
          echo "=== Node.js ==="
          node --version
          echo "=== Certificate chain ==="
          openssl s_client \
            -connect www.knt-liner.co.jp:443 \
            -servername www.knt-liner.co.jp \
            -showcerts </dev/null 2>&1 | tail -n 60


      - name: Run timetable check
        run: node sannomiya-fc-bus/timetable-check/check.js
        env:
          NODE_USE_SYSTEM_CA: "1"

      - name: Upload debug file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timetable-debug
          path: sannomiya-fc-bus/timetable-check/debug-timetable.txt

      - name: Commit timetable status
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sannomiya-fc-bus/timetable-check/status.json
          git add sannomiya-fc-bus/timetable-check/snapshot.json

          if git diff --cached --quiet; then
            echo "No status changes."
          else
            git commit -m "Update timetable check status"
            git push
          fi
