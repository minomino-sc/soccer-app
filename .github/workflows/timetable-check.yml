name: Timetable Check

on:
  schedule:
    # テスト：5分おきに実行
    - cron: "*/5 * * * *"


  workflow_dispatch:

permissions:
  contents: write

jobs:

  check-timetable:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install cheerio

      - name: Run timetable check
        run: node timetable-check/check.js

      - name: Commit timetable status
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add timetable-check/status.json

          if git diff --cached --quiet; then
            echo "No status changes."
          else
            git commit -m "Update timetable check status"
            git push
          fi
