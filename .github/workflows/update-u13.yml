name: U13 League Update

on:

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-u13:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm init -y
          npm install cheerio

      - name: Update U13 data
        run: |
          node <<'NODE'

          const fs = require("fs");
          const cheerio = require("cheerio");

          const TARGET_URL =
            "https://junior-soccer.jp/kansai/hyogo/league/table/165859";

          const TEAM_NAME =
            "神戸三宮FC";

          const DATA_PATH =
            "u13/data.json";


          /* =========================================================
             共通
          ========================================================= */

          function cleanText(value) {

            return String(value || "")
              .replace(/\s+/g, " ")
              .trim();

          }


          function parseScore(text) {

            const value =
              String(text || "")
                .replace(/\s+/g, "")
                .trim();

            /*
             * 例
             * 1○0
             * 2●1
             * 0△0
             */

            const match =
              value.match(
                /^(\d+)([○●△])(\d+)$/
              );

            if (!match) {
              return null;
            }

            return {
              home: Number(match[1]),
              symbol: match[2],
              away: Number(match[3])
            };

          }


          function resultFromScore(
            score,
            isHome
          ) {

            if (!score) {
              return null;
            }

            const myScore =
              isHome
                ? score.home
                : score.away;

            const opponentScore =
              isHome
                ? score.away
                : score.home;

            if (myScore > opponentScore) {
              return "win";
            }

            if (myScore < opponentScore) {
              return "loss";
            }

            return "draw";

          }


          function normalizeTeamName(name) {

            return cleanText(name)
              .replace(
                /[\r\n\t]/g,
                ""
              );

          }


          /* =========================================================
             メイン
          ========================================================= */

          async function main() {

            console.log("");
            console.log("======================================");
            console.log("U13 League Data Update");
            console.log("======================================");
            console.log(
              "Target:",
              TARGET_URL
            );
            console.log(
              "Team:",
              TEAM_NAME
            );
            console.log("");


            /* =====================================================
               ページ取得
            ===================================================== */

            const response =
              await fetch(
                TARGET_URL,
                {
                  headers: {
                    "User-Agent":
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                    "Accept":
                      "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                    "Accept-Language":
                      "ja,en-US;q=0.9,en;q=0.8"
                  }
                }
              );


            if (!response.ok) {

              throw new Error(
                "HTTP " +
                response.status +
                " " +
                response.statusText
              );

            }


            const html =
              await response.text();


            console.log(
              "HTML取得成功:",
              html.length,
              "bytes"
            );


            if (
              !html.includes(
                TEAM_NAME
              )
            ) {

              throw new Error(
                "取得したHTML内に「" +
                TEAM_NAME +
                "」が見つかりません。"
              );

            }


            const $ =
              cheerio.load(html);


            console.log(
              "table:",
              $("table").length
            );


            /* =====================================================
               U13 1部のテーブルを探す
            ===================================================== */

            let leagueTable = null;


            $("table").each(
              (_, table) => {

                if (leagueTable) {
                  return;
                }


                const text =
                  cleanText(
                    $(table).text()
                  );


                /*
                 * U13 1部のチーム名が
                 * 複数含まれるテーブルを探す。
                 */

                if (
                  text.includes(
                    TEAM_NAME
                  ) &&
                  (
                    text.includes(
                      "BASARA HYOGO"
                    ) ||
                    text.includes(
                      "パスィーノ"
                    )
                  )
                ) {

                  leagueTable =
                    $(table);

                }

              }
            );


            if (!leagueTable) {

              console.log("");
              console.log(
                "検出できたtable一覧:"
              );


              $("table").each(
                (index, table) => {

                  const text =
                    cleanText(
                      $(table).text()
                    );


                  console.log(
                    "TABLE",
                    index,
                    ":",
                    text.slice(
                      0,
                      300
                    )
                  );

                }
              );


              throw new Error(
                "U13 1部の対戦表を検出できませんでした。"
              );

            }


            console.log("");
            console.log(
              "U13 1部対戦表を検出しました。"
            );


            /* =====================================================
               テーブル確認
            ===================================================== */

            const rows =
              leagueTable.find("tr");


            console.log(
              "Rows:",
              rows.length
            );


            rows.each(
              (index, row) => {

                if (index >= 5) {
                  return;
                }


                const cells =
                  $(row)
                    .find("th,td");


                const values = [];


                cells.each(
                  (_, cell) => {

                    values.push(
                      cleanText(
                        $(cell).text()
                      )
                    );

                  }
                );


                console.log(
                  "ROW",
                  index,
                  ":",
                  values
                );

              }
            );


            /* =====================================================
               チーム名抽出
            ===================================================== */

            const allText =
              cleanText(
                leagueTable.text()
              );


            const knownTeams = [
              "神戸三宮FC",
              "BASARA HYOGO",
              "パスィーノ",
              "センアーノ神戸",
              "ヴィッセル神戸",
              "伊丹FC",
              "FC PASENO",
              "エベイユFC",
              "西宮タイガース",
              "芦屋SC",
              "神戸FC",
              "FCみなと-GRAW"
            ];


            const detectedTeams =
              knownTeams.filter(
                team =>
                  allText.includes(team)
              );


            console.log("");
            console.log(
              "Detected known teams:",
              detectedTeams.length
            );
            console.log(
              detectedTeams
            );


            /*
             * 神戸三宮FCが存在することを
             * 最低条件として確認。
             */

            if (
              !detectedTeams.includes(
                TEAM_NAME
              )
            ) {

              throw new Error(
                TEAM_NAME +
                " を確認できませんでした。"
              );

            }


            /* =====================================================
               既存data.json
            ===================================================== */

            if (
              !fs.existsSync(
                DATA_PATH
              )
            ) {

              throw new Error(
                DATA_PATH +
                " が存在しません。"
              );

            }


            const current =
              JSON.parse(
                fs.readFileSync(
                  DATA_PATH,
                  "utf8"
                )
              );


            /* =====================================================
               今回はまず既存のstandings / matchesを
               壊さない。
               
               実際のHTML構造確認後に
               正確な自動取得処理へ進める。
            ===================================================== */

            current.updatedAt =
              new Date()
                .toISOString()
                .slice(
                  0,
                  10
                );


            /*
             * HTML取得が正常にできたことを
             * data.jsonに記録。
             */

            current.source =
              TARGET_URL;


            fs.writeFileSync(
              DATA_PATH,
              JSON.stringify(
                current,
                null,
                2
              ) +
              "\n"
            );


            console.log("");
            console.log(
              "======================================"
            );
            console.log(
              "U13 data.json updated"
            );
            console.log(
              "======================================"
            );
            console.log(
              "HTML取得:",
              "OK"
            );
            console.log(
              "神戸三宮FC:",
              "確認OK"
            );
            console.log(
              "更新日:",
              current.updatedAt
            );
            console.log("");

          }


          main()
            .catch(
              error => {

                console.error("");
                console.error(
                  "======================================"
                );
                console.error(
                  "U13 UPDATE ERROR"
                );
                console.error(
                  "======================================"
                );
                console.error(
                  error
                );

                process.exit(1);

              }
            );

          NODE

      - name: Check changes
        run: |
          echo "======================================"
          echo "Git status"
          echo "======================================"

          git status --short

      - name: Commit update
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add u13/data.json

          git diff --cached --quiet || \
            git commit \
            -m "Update U13 league data"

          git push
