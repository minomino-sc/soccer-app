<!doctype html>
<html lang="ja">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="apple-touch-icon" href="../IMG_4611.jpeg">

<title>👨‍🏫 コーチ練習出欠</title>

<style>

body{
  margin:0;
  font-family:system-ui;
  background:#f6f8fb;
  color:#333;
}

.container{
  max-width:600px;
  margin:0 auto;
  padding:20px;
}

h1{
  text-align:center;
  font-size:24px;
  margin:10px 0 30px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:20px;
}

.event-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.event-card{
  background:#fff;
  border-radius:15px;
  padding:16px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
  cursor:pointer;
}

.event-card:active{
  transform:scale(0.98);
}

.event-date{
  font-size:18px;
  font-weight:bold;
  margin-bottom:6px;
}

.event-info{
  font-size:14px;
  line-height:1.6;
}
  
.team-badge{
  display:inline-block;
  margin-bottom:6px;
  padding:4px 10px;
  border-radius:20px;
  background:#f1f1f1;
  font-size:14px;
  font-weight:bold;
}




  
.answer-box{
  background:#fff;
  border-radius:15px;
  padding:20px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.selected-event{
  padding-bottom:18px;
  border-bottom:1px solid #eee;
}

.event-title{
  font-size:18px;
  font-weight:bold;
  margin:8px 0;
}

.answer-title{
  margin-top:20px;
  margin-bottom:8px;
  font-size:16px;
  font-weight:bold;
}

.coach-select{
  width:100%;
  padding:12px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:10px;
  background:#fff;
}

.answer-buttons{
  display:flex;
  gap:10px;
}

.answer-buttons button{
  flex:1;
  padding:14px 10px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.attend-btn{
  background:#d9f7df;
  color:#176b2c;
}

.absent-btn{
  background:#ffe0e0;
  color:#a00000;
}

.back-list-btn{
  width:100%;
  margin-top:20px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#f1f1f1;
  font-size:14px;
  font-weight:bold;
}

  




  
.empty{
  background:#fff;
  border-radius:15px;
  padding:25px 20px;
  text-align:center;
  color:#777;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.back{
  display:block;
  margin-top:25px;
  text-align:center;
  text-decoration:none;
  color:#333;
  font-weight:bold;
}

.loading{
  text-align:center;
  color:#777;
  padding:30px 0;
}

</style>

</head>

<body>

<div class="container">

  <h1>👨‍🏫 コーチ練習出欠</h1>

  <div class="subtitle">
    練習予定を選択してください
  </div>

  <div id="eventList" class="event-list">
    <div class="loading">
      練習予定を読み込んでいます...
    </div>
  </div>

  <a class="back" href="../">
    ← メインメニューへ戻る
  </a>

</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDMJfAd5BffteapT51ZUO06VP-XDReFSwY",
  authDomain: "minotani-sc-app.firebaseapp.com",
  projectId: "minotani-sc-app",
  storageBucket: "minotani-sc-app.firebasestorage.app",
  messagingSenderId: "757066295000",
  appId: "1:757066295000:web:1c7a90f968af75d26099ad"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const eventList = document.getElementById("eventList");


// ========================================
// 練習予定を取得
// ========================================

db.collection("calendar_events")
  .onSnapshot(snapshot => {

    const practiceEvents = [];

    snapshot.forEach(doc => {

      const data = doc.data();

      // 「練習」だけ取得
if(data.type === "practice"){

  const today = new Date();
  today.setHours(0,0,0,0);

  const eventDate = new Date(data.date + "T00:00:00");

  // 今日以降の練習だけ表示
  if(eventDate >= today){

    practiceEvents.push({
      id: doc.id,
      ...data
    });

  }

}

    });

    // 日付順に並べる
    practiceEvents.sort((a,b) =>
      a.date.localeCompare(b.date)
    );

    renderEvents(practiceEvents);

  });


// ========================================
// 練習予定を画面に表示
// ========================================

function renderEvents(events){

  eventList.innerHTML = "";

  if(events.length === 0){

    eventList.innerHTML = `
      <div class="empty">
        練習予定はありません。
      </div>
    `;

    return;
  }


  events.forEach(ev => {

    const card = document.createElement("div");

    card.className = "event-card";

    card.innerHTML = `

      <div class="event-date">
        🟢 ${formatDate(ev.date)}
      </div>

<div class="event-info">

  <div class="team-badge">
    ${ev.team === "A" ? "🔵 チームA"
      : ev.team === "B" ? "🟢 チームB"
      : ev.team === "AB" ? "🟣 チームA/B"
      : ev.team === "Z" ? "🔴 その他"
      : "⚪ チーム未設定"}
  </div>

  <strong>${ev.text || "練習"}</strong><br>

  📍 ${ev.location || "場所未設定"}<br>

  🕒 ${ev.time || "時間未設定"}

</div>

    `;


// 予定をタップしたとき
card.addEventListener("click", () => {

  showAnswerScreen(ev);

});


    eventList.appendChild(card);

  });

}

// ========================================
// コーチ回答画面
// ========================================

function showAnswerScreen(ev){

  eventList.innerHTML = "";

  const answerBox = document.createElement("div");

  answerBox.className = "answer-box";

  answerBox.innerHTML = `

    <div class="selected-event">

      <div class="event-date">
        🟢 ${formatDate(ev.date)}
      </div>

      <div class="team-badge">
        ${ev.team === "A" ? "🔵 チームA"
          : ev.team === "B" ? "🟢 チームB"
          : ev.team === "AB" ? "🟣 チームA/B"
          : ev.team === "Z" ? "🔴 その他"
          : "⚪ チーム未設定"}
      </div>

      <div class="event-title">
        ${ev.text || "練習"}
      </div>

      <div class="event-info">
        📍 ${ev.location || "場所未設定"}<br>
        🕒 ${ev.time || "時間未設定"}
      </div>

    </div>


    <div class="answer-title">
      👨‍🏫 コーチを選択してください
    </div>

    <select id="coachSelect" class="coach-select">

      <option value="">コーチを選択</option>

      <option value="コーチA">コーチA</option>
      <option value="コーチB">コーチB</option>
      <option value="コーチC">コーチC</option>

    </select>


    <div class="answer-title">
      出欠を選択してください
    </div>


    <div class="answer-buttons">

      <button
        class="attend-btn"
        onclick="saveCoachAnswer('${ev.id}', '参加')">
        🟢 参加
      </button>

      <button
        class="absent-btn"
        onclick="saveCoachAnswer('${ev.id}', '欠席')">
        🔴 欠席
      </button>

    </div>


    <button
      class="back-list-btn"
      onclick="loadPracticeEvents()">
      ← 練習予定一覧に戻る
    </button>

  `;

  eventList.appendChild(answerBox);

}

// ========================================
// コーチの出欠を保存
// ========================================

async function saveCoachAnswer(eventId, status){

  const coachSelect =
    document.getElementById("coachSelect");

  const coachName = coachSelect.value;

  if(!coachName){

    alert("コーチを選択してください");

    return;
  }


  try{

    const answerId =
      eventId + "_" + encodeURIComponent(coachName);

    await db
      .collection("coach_practice_answers")
      .doc(answerId)
      .set({

        eventId: eventId,

        coachName: coachName,

        status: status,

        updatedAt:
          firebase.firestore.FieldValue.serverTimestamp()

      }, { merge:true });


    alert(
      coachName + "さんの回答を保存しました。\n\n" +
      "出欠： " + status
    );


  }catch(error){

    console.error(error);

    alert(
      "回答の保存に失敗しました。\n" +
      error.message
    );

  }

}


  

// ========================================
// 練習予定一覧に戻る
// ========================================

function loadPracticeEvents(){

  location.reload();

}


  
  
// ========================================
// 日付表示
// ========================================

function formatDate(dateStr){

  const date = new Date(dateStr + "T00:00:00");

  const weekdays = [
    "日","月","火","水","木","金","土"
  ];

  return `${date.getMonth()+1}月${date.getDate()}日（${weekdays[date.getDay()]}）`;

}

</script>

</body>
</html>
