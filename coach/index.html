<!doctype html>
<html lang="ja">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="apple-touch-icon" href="../IMG_4611.jpeg">

<title>👨‍🏫 コーチ練習出欠</title>

<style>

body{
  margin:0;
  font-family:system-ui;
  background:#f6f8fb;
  color:#333;
}

.container{
  max-width:600px;
  margin:0 auto;
  padding:20px;
}

h1{
  text-align:center;
  font-size:24px;
  margin:10px 0 30px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:20px;
}

.event-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.event-card{
  background:#fff;
  border-radius:15px;
  padding:16px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
  cursor:pointer;
}

.event-card:active{
  transform:scale(0.98);
}

.event-date{
  font-size:18px;
  font-weight:bold;
  margin-bottom:6px;
}

.event-info{
  font-size:14px;
  line-height:1.6;
}

.team-badge{
  display:inline-block;
  margin-bottom:6px;
  padding:4px 10px;
  border-radius:20px;
  background:#f1f1f1;
  font-size:14px;
  font-weight:bold;
}


/* ========================================
   回答画面
======================================== */

.answer-box{
  background:#fff;
  border-radius:15px;
  padding:20px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.selected-event{
  padding-bottom:18px;
  border-bottom:1px solid #eee;
}

.event-title{
  font-size:18px;
  font-weight:bold;
  margin:8px 0;
}

.answer-title{
  margin-top:20px;
  margin-bottom:8px;
  font-size:16px;
  font-weight:bold;
}

.coach-select{
  width:100%;
  padding:12px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:10px;
  background:#fff;
}

.coach-comment{
  width:100%;
  min-height:90px;
  padding:12px;
  box-sizing:border-box;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:10px;
  background:#fff;
  resize:vertical;
  font-family:system-ui;
  margin-bottom:10px;
}

.answer-buttons{
  display:flex;
  gap:10px;
}

.answer-buttons button{
  flex:1;
  padding:14px 10px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.attend-btn{
  background:#d9f7df;
  color:#176b2c;
}

.absent-btn{
  background:#ffe0e0;
  color:#a00000;
}

.back-list-btn{
  width:100%;
  margin-top:20px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#f1f1f1;
  font-size:14px;
  font-weight:bold;
}


/* ========================================
   全コーチ回答状況
======================================== */

.answer-status-box{
  margin-top:25px;
  padding-top:20px;
  border-top:1px solid #eee;
}

.status-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}


/* 集計 */

.status-summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:15px;
}

.summary-item{
  text-align:center;
  padding:10px 5px;
  border-radius:10px;
  font-size:13px;
  font-weight:bold;
}

.summary-attend{
  background:#d9f7df;
  color:#176b2c;
}

.summary-absent{
  background:#ffe0e0;
  color:#a00000;
}

.summary-unanswered{
  background:#f1f1f1;
  color:#666;
}


/* コーチ一覧 */

.coach-answer-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.coach-answer-item{
  padding:12px;
  border-radius:10px;
  background:#f7f7f7;
}

.coach-answer-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.coach-name{
  font-weight:bold;
  font-size:15px;
}

.status-badge{
  padding:4px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
}

.status-attend{
  background:#d9f7df;
  color:#176b2c;
}

.status-absent{
  background:#ffe0e0;
  color:#a00000;
}

.status-unanswered{
  background:#eaeaea;
  color:#777;
}

.coach-comment-display{
  margin-top:7px;
  padding:8px 10px;
  background:#fff;
  border-radius:7px;
  font-size:13px;
  line-height:1.5;
  color:#555;
}

.no-comment{
  color:#999;
  font-size:12px;
  margin-top:5px;
}


/* ========================================
   その他
======================================== */

.empty{
  background:#fff;
  border-radius:15px;
  padding:25px 20px;
  text-align:center;
  color:#777;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.loading{
  text-align:center;
  color:#777;
  padding:30px 0;
}

</style>

</head>


<body>

<div class="container">

  <h1>👨‍🏫 コーチ練習出欠</h1>

  <div class="subtitle">
    練習予定を選択してください
  </div>

  <div id="eventList" class="event-list">

    <div class="loading">
      練習予定を読み込んでいます...
    </div>

  </div>

</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>


<script>


// ========================================
// Firebase
// ========================================

const firebaseConfig = {

  apiKey: "AIzaSyDMJfAd5Bffteap5T1ZUO06VP-XDReFSwY",
  authDomain: "minotani-sc-app.firebaseapp.com",
  projectId: "minotani-sc-app",
  storageBucket: "minotani-sc-app.firebasestorage.app",
  messagingSenderId: "757066295000",
  appId: "1:757066295000:web:1c7a90f968af75d26099ad"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const eventList =
  document.getElementById("eventList");


// ========================================
// コーチ一覧
// ========================================

const COACHES = [

  "松岡コーチ",
  "横江コーチ",
  "二宮コーチ",
  "森本コーチ",
  "三宅コーチ",
  "高﨑コーチ",

  "梶原コーチ",
  "田中コーチ",
  "川村コーチ",
  "大村コーチ",
  "入江コーチ",
  "西川コーチ"

];


// ========================================
// 練習予定を取得
// ========================================

db.collection("calendar_events")
  .onSnapshot(snapshot => {

    const practiceEvents = [];

    snapshot.forEach(doc => {

      const data = doc.data();

      if(data.type === "practice"){

        const today = new Date();

        today.setHours(0,0,0,0);

        const eventDate =
          new Date(data.date + "T00:00:00");

        // 今日以降だけ表示
        if(eventDate >= today){

          practiceEvents.push({

            id: doc.id,
            ...data

          });

        }

      }

    });


    // 日付順
    practiceEvents.sort((a,b) =>
      a.date.localeCompare(b.date)
    );


    renderEvents(practiceEvents);

  });


// ========================================
// 練習予定一覧
// ========================================

function renderEvents(events){

  eventList.innerHTML = "";


  if(events.length === 0){

    eventList.innerHTML = `

      <div class="empty">
        練習予定はありません。
      </div>

    `;

    return;

  }


  events.forEach(ev => {

    const card =
      document.createElement("div");

    card.className = "event-card";


    card.innerHTML = `

      <div class="event-date">
        🟢 ${formatDate(ev.date)}
      </div>

      <div class="event-info">

        <div class="team-badge">

          ${
            ev.team === "A"
              ? "🔵 チームA"
              : ev.team === "B"
              ? "🟢 チームB"
              : ev.team === "AB"
              ? "🟣 チームA/B"
              : ev.team === "Z"
              ? "🔴 その他"
              : "⚪ チーム未設定"
          }

        </div>

        <strong>
          ${ev.text || "練習"}
        </strong>

        <br>

        📍 ${ev.location || "場所未設定"}

        <br>

        🕒 ${ev.time || "時間未設定"}

      </div>

    `;


    // タップ
    card.addEventListener("click", () => {

      showAnswerScreen(ev);

    });


    eventList.appendChild(card);

  });

}


// ========================================
// コーチ回答画面
// ========================================

function showAnswerScreen(ev){

  eventList.innerHTML = "";


  const answerBox =
    document.createElement("div");

  answerBox.className = "answer-box";


  answerBox.innerHTML = `

    <!-- 練習予定 -->

    <div class="selected-event">

      <div class="event-date">
        ⭐️ ${formatDate(ev.date)}
      </div>

      <div class="team-badge">

        ${
          ev.team === "A"
            ? "🔵 チームA"
            : ev.team === "B"
            ? "🟢 チームB"
            : ev.team === "AB"
            ? "🟣 チームA/B"
            : ev.team === "Z"
            ? "🔴 その他"
            : "⚪ チーム未設定"
        }

      </div>

      <div class="event-title">

        ${ev.text || "練習"}

      </div>

      <div class="event-info">

        📍 ${ev.location || "場所未設定"}

        <br>

        🕒 ${ev.time || "時間未設定"}

      </div>

    </div>


    <!-- 回答入力 -->

    <div class="answer-title">
      👨‍🏫 コーチを選択してください
    </div>


    <select
      id="coachSelect"
      class="coach-select"
    >

      <option value="">
        コーチを選択
      </option>

      ${COACHES.map(coach => `
        <option value="${coach}">
          ${coach}
        </option>
      `).join("")}

    </select>


    <div class="answer-title">
      💬 コメント（任意）
    </div>


    <textarea
      id="coachComment"
      class="coach-comment"
      placeholder="コメントがあれば入力してください"
    ></textarea>


    <div class="answer-title">
      出欠を選択してください
    </div>


    <div class="answer-buttons">

      <button
        class="attend-btn"
        onclick="saveCoachAnswer('${ev.id}', '参加')"
      >
        🟢 参加
      </button>


      <button
        class="absent-btn"
        onclick="saveCoachAnswer('${ev.id}', '欠席')"
      >
        🔴 欠席
      </button>

    </div>


    <!-- 全コーチ回答状況 -->

    <div
      id="answerStatus"
      class="answer-status-box"
    >

      <div class="loading">
        回答状況を読み込んでいます...
      </div>

    </div>


    <!-- 一覧へ戻る -->

    <button
      class="back-list-btn"
      onclick="loadPracticeEvents()"
    >
      ← 練習予定一覧に戻る
    </button>

  `;


  eventList.appendChild(answerBox);


  // 回答状況を監視
  watchCoachAnswers(ev.id);

}


// ========================================
// コーチの出欠を保存
// ========================================

async function saveCoachAnswer(eventId, status){

  const coachSelect =
    document.getElementById("coachSelect");

  const coachName =
    coachSelect.value;


  const comment =
    document
      .getElementById("coachComment")
      .value
      .trim();


  if(!coachName){

    alert("コーチを選択してください");

    return;

  }


  try{

    const answerId =
      eventId +
      "_" +
      encodeURIComponent(coachName);


    await db
      .collection("coach_practice_answers")
      .doc(answerId)
      .set({

        eventId: eventId,

        coachName: coachName,

        status: status,

        comment: comment,

        updatedAt:
          firebase.firestore.FieldValue.serverTimestamp()

      }, { merge:true });


    alert(

      coachName +
      "さんの回答を保存しました。\n\n" +

      "出欠： " +
      status

    );


    // 回答したコーチのコメントをクリア
    document.getElementById(
      "coachComment"
    ).value = "";


  }catch(error){

    console.error(error);


    alert(

      "回答の保存に失敗しました。\n" +
      error.message

    );

  }

}


// ========================================
// 全コーチの回答状況をリアルタイム取得
// ========================================

function watchCoachAnswers(eventId){

  db.collection("coach_practice_answers")
    .where("eventId", "==", eventId)
    .onSnapshot(snapshot => {


      // 回答データを整理

      const answers = {};


      snapshot.forEach(doc => {

        const data = doc.data();

        answers[data.coachName] = data;

      });


      renderCoachAnswers(answers);

    });

}


// ========================================
// 全コーチ回答を表示
// ========================================

function renderCoachAnswers(answers){

  const box =
    document.getElementById("answerStatus");


  if(!box) return;


  let attendCount = 0;

  let absentCount = 0;

  let unansweredCount = 0;


  COACHES.forEach(coach => {

    const answer =
      answers[coach];


    if(!answer){

      unansweredCount++;

    }
    else if(answer.status === "参加"){

      attendCount++;

    }
    else if(answer.status === "欠席"){

      absentCount++;

    }

  });


  let html = `

    <div class="status-title">
      👨‍🏫 全コーチの回答状況
    </div>


    <div class="status-summary">

      <div class="summary-item summary-attend">
        🟢 参加<br>
        ${attendCount}人
      </div>

      <div class="summary-item summary-absent">
        🔴 欠席<br>
        ${absentCount}人
      </div>

      <div class="summary-item summary-unanswered">
        ⚪ 未回答<br>
        ${unansweredCount}人
      </div>

    </div>


    <div class="coach-answer-list">

  `;


  COACHES.forEach(coach => {

    const answer =
      answers[coach];


    // 未回答
    if(!answer){

      html += `

        <div class="coach-answer-item">

          <div class="coach-answer-header">

            <span class="coach-name">
              ${coach}
            </span>

            <span
              class="status-badge status-unanswered"
            >
              ⚪ 未回答
            </span>

          </div>

        </div>

      `;

      return;

    }


    // 参加
    if(answer.status === "参加"){

      html += `

        <div class="coach-answer-item">

          <div class="coach-answer-header">

            <span class="coach-name">
              ${coach}
            </span>

            <span
              class="status-badge status-attend"
            >
              🟢 参加
            </span>

          </div>

          ${
            answer.comment
              ? `
                <div class="coach-comment-display">
                  💬 ${answer.comment}
                </div>
              `
              : `
                <div class="no-comment">
                  コメントなし
                </div>
              `
          }

        </div>

      `;

      return;

    }


    // 欠席
    if(answer.status === "欠席"){

      html += `

        <div class="coach-answer-item">

          <div class="coach-answer-header">

            <span class="coach-name">
              ${coach}
            </span>

            <span
              class="status-badge status-absent"
            >
              🔴 欠席
            </span>

          </div>

          ${
            answer.comment
              ? `
                <div class="coach-comment-display">
                  💬 ${answer.comment}
                </div>
              `
              : `
                <div class="no-comment">
                  コメントなし
                </div>
              `
          }

        </div>

      `;

    }

  });


  html += `

    </div>

  `;


  box.innerHTML = html;

}


// ========================================
// 練習予定一覧に戻る
// ========================================

function loadPracticeEvents(){

  location.reload();

}


// ========================================
// 日付表示
// ========================================

function formatDate(dateStr){

  const date =
    new Date(dateStr + "T00:00:00");


  const weekdays = [

    "日",
    "月",
    "火",
    "水",
    "木",
    "金",
    "土"

  ];


  return (

    `${date.getMonth()+1}月` +
    `${date.getDate()}日` +
    `（${weekdays[date.getDay()]}）`

  );

}


</script>

</body>
</html>
