
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通知鍵生成</title>
</head>
<body style="font-family:sans-serif;padding:20px;max-width:600px;margin:auto">

<h2>🔐 Web Push 鍵生成</h2>
<p>このページ内だけで鍵を生成します。鍵は外部に送信されません。</p>

<button id="generate">鍵を生成する</button>

<p>公開鍵</p>
<textarea id="publicKey" rows="4" style="width:100%" readonly></textarea>
<button id="copyPublic">公開鍵をコピー</button>

<p>秘密鍵</p>
<textarea id="privateKey" rows="4" style="width:100%" readonly></textarea>
<button id="copyPrivate">秘密鍵をコピー</button>

<p id="status"></p>

<script>
function encodeBase64Url(bytes) {
  let binary = "";
  for (const b of bytes) {
    binary += String.fromCharCode(b);
  }
  return btoa(binary)
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

function decodeBase64Url(value) {
  let base64 = value
    .replace(/-/g, "+")
    .replace(/_/g, "/");

  base64 += "=".repeat((4 - base64.length % 4) % 4);

  const binary = atob(base64);
  return Uint8Array.from(binary, c => c.charCodeAt(0));
}

document.getElementById("generate").onclick = async () => {
  const status = document.getElementById("status");

  try {
    const pair = await crypto.subtle.generateKey(
      { name: "ECDSA", namedCurve: "P-256" },
      true,
      ["sign", "verify"]
    );

    const jwk = await crypto.subtle.exportKey("jwk", pair.privateKey);

    const x = decodeBase64Url(jwk.x);
    const y = decodeBase64Url(jwk.y);
    const d = decodeBase64Url(jwk.d);

    const publicBytes = new Uint8Array(65);
    publicBytes[0] = 4;
    publicBytes.set(x, 1);
    publicBytes.set(y, 33);

    document.getElementById("publicKey").value =
      encodeBase64Url(publicBytes);

    document.getElementById("privateKey").value =
      encodeBase64Url(d);

    status.textContent =
      "鍵を生成しました。秘密鍵は他人に見せないでください。";

  } catch (e) {
    status.textContent = "生成できませんでした：" + e.message;
  }
};

document.getElementById("copyPublic").onclick = async () => {
  await navigator.clipboard.writeText(
    document.getElementById("publicKey").value
  );
};

document.getElementById("copyPrivate").onclick = async () => {
  await navigator.clipboard.writeText(
    document.getElementById("privateKey").value
  );
};
</script>

</body>
</html>
