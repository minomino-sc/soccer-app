
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>通知鍵生成</title>
</head>
<body style="font-family:sans-serif;padding:20px;max-width:600px;margin:auto">
<h2>🔐 Web Push 鍵生成</h2>
<p>このページ内で鍵を生成します。鍵は外部に送信されません。</p>
<button id="generate">鍵を生成する</button>
<p>公開鍵</p>
<textarea id="publicKey" rows="3" style="width:100%" readonly></textarea>
<button id="copyPublic">公開鍵をコピー</button>
<p>秘密鍵</p>
<textarea id="privateKey" rows="3" style="width:100%" readonly></textarea>
<button id="copyPrivate">秘密鍵をコピー</button>
<p id="status"></p>

<script>
const encode = bytes => {
  let binary = "";
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary)
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
};

document.getElementById("generate").onclick = async () => {
  try {
    const pair = await crypto.subtle.generateKey(
      { name: "ECDSA", namedCurve: "P-256" },
      true,
      ["sign", "verify"]
    );

    const jwk = await crypto.subtle.exportKey("jwk", pair.privateKey);

    const x = Uint8Array.from(atob(jwk.x.replace(/-/g,"+").replace(/_/g,"/") + "=="), c => c.charCodeAt(0));
    const y = Uint8Array.from(atob(jwk.y.replace(/-/g,"+").replace(/_/g,"/") + "=="), c => c.charCodeAt(0));
    const d = Uint8Array.from(atob(jwk.d.replace(/-/g,"+").replace(/_/g,"/") + "=="), c => c.charCodeAt(0));

    const publicBytes = new Uint8Array(65);
    publicBytes[0] = 4;
    publicBytes.set(x, 1);
    publicBytes.set(y, 33);

    document.getElementById("publicKey").value = encode(publicBytes);
    document.getElementById("privateKey").value = encode(d);
    document.getElementById("status").textContent =
      "鍵を生成しました。秘密鍵は他人に見せないでください。";
  } catch (e) {
    document.getElementById("status").textContent =
      "生成できませんでした：" + e.message;
  }
};

document.getElementById("copyPublic").onclick = async () => {
  await navigator.clipboard.writeText(document.getElementById("publicKey").value);
};

document.getElementById("copyPrivate").onclick = async () => {
  await navigator.clipboard.writeText(document.getElementById("privateKey").value);
};
</script>
</body>
</html>
