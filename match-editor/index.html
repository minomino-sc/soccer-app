<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111827">

  <title>⚽ 試合動画エディター</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="header">
      <h1>⚽ 試合動画エディター</h1>
      <p>GOALをタップして試合経過を記録</p>
    </header>

    <section class="card">

      <h2>試合情報</h2>

      <div class="team-inputs">

        <div class="team-box home">
          <label for="homeTeam">ホーム</label>
          <input
            id="homeTeam"
            type="text"
            value="箕谷A"
            maxlength="20"
          >
        </div>

        <div class="vs">VS</div>

        <div class="team-box away">
          <label for="awayTeam">アウェイ</label>
          <input
            id="awayTeam"
            type="text"
            value="相手"
            maxlength="20"
          >
        </div>

      </div>

    </section>


    <section class="card">

      <h2>動画</h2>

      <label class="video-select">
        <span>🎥 試合動画を選択</span>
        <input
          id="videoFile"
          type="file"
          accept="video/*"
        >
      </label>

      <div class="video-wrapper">
        <video
          id="video"
          controls
          playsinline
          preload="metadata"
        ></video>
      </div>

      <div class="time-display">
        <span id="currentTime">00:00</span>
        <span>/</span>
        <span id="duration">00:00</span>
      </div>

    </section>


    <section class="score-card">

      <div class="score-team">
        <div id="homeScoreTeam">箕谷A</div>
        <strong id="homeScore">0</strong>
      </div>

      <div class="score-vs">-</div>

      <div class="score-team">
        <div id="awayScoreTeam">相手</div>
        <strong id="awayScore">0</strong>
      </div>

    </section>


    <section class="goal-buttons">

      <button
        id="homeGoalBtn"
        class="goal-button home-goal"
        type="button"
      >
        <span>⚽</span>
        <strong>GOAL</strong>
        <small id="homeGoalLabel">箕谷A</small>
      </button>

      <button
        id="awayGoalBtn"
        class="goal-button away-goal"
        type="button"
      >
        <span>⚽</span>
        <strong>GOAL</strong>
        <small id="awayGoalLabel">相手</small>
      </button>

    </section>


    <section class="card">

      <div class="section-title-row">
        <h2>ゴール記録</h2>

        <button
          id="resetBtn"
          class="reset-button"
          type="button"
        >
          リセット
        </button>
      </div>

      <div id="goalList" class="goal-list">
        <p class="empty-message">
          まだゴールは記録されていません。
        </p>
      </div>

    </section>


    <section id="message" class="message" aria-live="polite"></section>

  </main>

  <script src="main.js"></script>

</body>
</html>
