<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111827">

  <title>⚽ 試合動画エディター</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="header">
      <h1>⚽ 試合動画エディター</h1>
      <p>試合経過をタップして記録</p>
    </header>


    <!-- =========================
         試合情報
    ========================== -->

    <section class="card">

      <h2>試合情報</h2>

      <div class="team-inputs">

        <div class="team-box home">
          <label for="homeTeam">ホーム</label>
          <input
            id="homeTeam"
            type="text"
            value="箕谷A"
            maxlength="20"
          >
        </div>

        <div class="vs">VS</div>

        <div class="team-box away">
          <label for="awayTeam">アウェイ</label>
          <input
            id="awayTeam"
            type="text"
            value="相手"
            maxlength="20"
          >
        </div>

      </div>

    </section>


    <!-- =========================
         動画
    ========================== -->

    <section class="card">

      <h2>動画</h2>


      <!-- 前半・後半動画選択 -->

      <div class="half-video-selects">

        <label class="video-select half-video-select">

          <span>🎥 前半動画を選択</span>

          <input
            id="firstHalfFile"
            type="file"
            accept="video/*"
          >

        </label>


        <label class="video-select half-video-select">

          <span>🎥 後半動画を選択</span>

          <input
            id="secondHalfFile"
            type="file"
            accept="video/*"
          >

        </label>

      </div>


      <!-- 動画ファイル状態 -->

      <div class="video-file-status">

        <div>
          <strong>前半：</strong>
          <span id="firstHalfFileName">未選択</span>
          <span id="firstHalfDuration" class="half-duration"></span>
        </div>

        <div>
          <strong>後半：</strong>
          <span id="secondHalfFileName">未選択</span>
          <span id="secondHalfDuration" class="half-duration"></span>
        </div>

      </div>


      <!-- 現在表示する動画 -->

      <div class="half-switch">

        <button
          id="showFirstHalfBtn"
          type="button"
          class="half-switch-button active"
        >
          前半を再生
        </button>

        <button
          id="showSecondHalfBtn"
          type="button"
          class="half-switch-button"
        >
          後半を再生
        </button>

      </div>


      <div class="current-half-label">
        現在：<strong id="currentHalfLabel">前半</strong>
      </div>


      <div class="video-wrapper">

        <video
          id="video"
          playsinline
          preload="metadata"
        ></video>

      </div>


      <!-- 再生コントロール -->

      <div class="video-controls">

        <button
          id="back5Btn"
          class="seek-control"
          type="button"
        >
          ⏪ 5秒
        </button>


        <button
          id="playPauseBtn"
          class="play-control"
          type="button"
        >
          ▶ 再生
        </button>


        <button
          id="forward5Btn"
          class="seek-control"
          type="button"
        >
          5秒 ⏩
        </button>

      </div>


      <!-- 再生速度 -->

      <div class="speed-section">

        <span class="speed-title">再生速度</span>

        <div class="speed-buttons">

          <button type="button" data-speed="0.5">
            0.5×
          </button>

          <button type="button" data-speed="1">
            1×
          </button>

          <button type="button" data-speed="1.5">
            1.5×
          </button>

          <button type="button" data-speed="2">
            2×
          </button>

          <button type="button" data-speed="4">
            4×
          </button>

          <button type="button" data-speed="8">
            8×
          </button>

        </div>

      </div>


      <div class="time-display">

        <span id="currentTime">00:00</span>

        <span>/</span>

        <span id="duration">00:00</span>

      </div>

    </section>


    <!-- =========================
         スコア
    ========================== -->

    <section class="score-card">

      <div class="score-team">

        <div id="homeScoreTeam">
          箕谷A
        </div>

        <strong id="homeScore">
          0
        </strong>

      </div>


      <div class="score-vs">
        -
      </div>


      <div class="score-team">

        <div id="awayScoreTeam">
          相手
        </div>

        <strong id="awayScore">
          0
        </strong>

      </div>

    </section>


    <!-- =========================
         試合開始・終了
    ========================== -->

    <section class="match-event-buttons">

      <button
        id="firstHalfBtn"
        class="match-event-button start-button"
        type="button"
      >
        <span>▶</span>
        <strong>前半開始</strong>
      </button>


      <button
        id="secondHalfBtn"
        class="match-event-button start-button"
        type="button"
      >
        <span>▶</span>
        <strong>後半開始</strong>
      </button>


      <button
        id="fullTimeBtn"
        class="match-event-button end-button"
        type="button"
      >
        <span>■</span>
        <strong>試合終了</strong>
      </button>

    </section>


    <!-- =========================
         GOAL
    ========================== -->

    <section class="goal-buttons">

      <button
        id="homeGoalBtn"
        class="goal-button home-goal"
        type="button"
      >

        <span>⚽</span>

        <strong>GOAL</strong>

        <small id="homeGoalLabel">
          箕谷A
        </small>

      </button>


      <button
        id="awayGoalBtn"
        class="goal-button away-goal"
        type="button"
      >

        <span>⚽</span>

        <strong>GOAL</strong>

        <small id="awayGoalLabel">
          相手
        </small>

      </button>

    </section>


    <!-- =========================
         イベント一覧
    ========================== -->

    <section class="card">

      <div class="section-title-row">

        <h2>試合記録</h2>

        <button
          id="resetBtn"
          class="reset-button"
          type="button"
        >
          リセット
        </button>

      </div>


      <div id="eventList" class="event-list">

        <p class="empty-message">
          まだ試合記録はありません。
        </p>

      </div>

    </section>


    <section
      id="message"
      class="message"
      aria-live="polite"
    ></section>

  </main>


  <script src="main.js"></script>

</body>
</html>
