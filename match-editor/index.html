<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>⚽ 試合動画エディター</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>⚽ 試合動画エディター</h1>
</header>

<main>

  <!-- チーム名 -->
  <section class="card">
    <h2>チーム名</h2>

    <div class="team-inputs">
      <input id="homeTeam" type="text" value="箕谷A" placeholder="ホーム">
      <span>VS</span>
      <input id="awayTeam" type="text" placeholder="相手チーム">
    </div>
  </section>


  <!-- 動画選択 -->
  <section class="card">
    <h2>試合動画</h2>

    <div class="video-select-grid">

      <div class="video-select-box">
        <div class="video-label">前半動画</div>

        <label class="file-button">
          前半動画を選択
          <input
            id="firstHalfFile"
            type="file"
            accept="video/*"
            hidden
          >
        </label>

        <div id="firstHalfStatus" class="video-status">
          未選択
        </div>

        <div id="firstHalfDuration" class="video-duration">
          --
        </div>
      </div>


      <div class="video-select-box">
        <div class="video-label">後半動画</div>

        <label class="file-button">
          後半動画を選択
          <input
            id="secondHalfFile"
            type="file"
            accept="video/*"
            hidden
          >
        </label>

        <div id="secondHalfStatus" class="video-status">
          未選択
        </div>

        <div id="secondHalfDuration" class="video-duration">
          --
        </div>
      </div>

    </div>
  </section>


  <!-- 現在表示している動画 -->
  <section class="card">

    <div class="current-half-row">
      <span>現在表示：</span>

      <button id="showFirstHalfBtn" class="half-switch active">
        前半
      </button>

      <button id="showSecondHalfBtn" class="half-switch">
        後半
      </button>
    </div>


    <div class="video-wrap">
      <video
        id="video"
        playsinline
        preload="metadata"
      ></video>
    </div>


    <!-- 動画操作 -->
    <div class="video-controls">

      <button id="back5Btn">↶ 5秒</button>

      <button id="playPauseBtn">▶ 再生</button>

      <button id="forward5Btn">5秒 ↷</button>

    </div>


    <!-- 再生速度 -->
    <div class="speed-section">

      <div class="speed-title">再生速度</div>

      <div class="speed-buttons">

        <button class="speed-btn" data-speed="0.5">0.5×</button>
        <button class="speed-btn active" data-speed="1">1×</button>
        <button class="speed-btn" data-speed="1.5">1.5×</button>
        <button class="speed-btn" data-speed="2">2×</button>
        <button class="speed-btn" data-speed="4">4×</button>
        <button class="speed-btn" data-speed="8">8×</button>

      </div>

    </div>


    <!-- 時間 -->
    <div class="time-display">
      <span id="currentTime">00:00</span>
      /
      <span id="duration">00:00</span>
    </div>

  </section>


  <!-- スコア -->
  <section class="score-card">

    <div class="score-team">
      <div id="homeTeamDisplay">箕谷A</div>
      <div id="homeScore">0</div>
    </div>

    <div class="score-vs">-</div>

    <div class="score-team">
      <div id="awayTeamDisplay">相手</div>
      <div id="awayScore">0</div>
    </div>

  </section>


  <!-- 試合イベント -->
  <section class="card">

    <h2>試合イベント</h2>

    <div class="match-buttons">

      <button id="firstHalfBtn" class="start-btn">
        前半開始
      </button>

      <button id="secondHalfBtn" class="start-btn">
        後半開始
      </button>

      <button id="fullTimeBtn" class="end-btn">
        試合終了
      </button>

    </div>


    <div class="goal-buttons">

      <button id="homeGoalBtn" class="home-goal">
        ⚽ 箕谷A GOAL
      </button>

      <button id="awayGoalBtn" class="away-goal">
        ⚽ 相手 GOAL
      </button>

    </div>

  </section>


  <!-- イベント一覧 -->
  <section class="card">

    <div class="event-header">
      <h2>イベント一覧</h2>
      <button id="resetBtn" class="reset-btn">
        リセット
      </button>
    </div>

    <div id="eventList" class="event-list"></div>

  </section>


  <div id="message" class="message"></div>

</main>

<script src="main.js"></script>

</body>
</html>
